<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fun game arcade cabinet silhouette -->
  <rect width="32" height="32" rx="6" fill="#F97316"/>
  <!-- Cabinet body -->
  <rect x="8" y="4" width="16" height="24" rx="2" fill="#1C1917"/>
  <!-- Screen -->
  <rect x="10" y="6" width="12" height="10" rx="1" fill="#22C55E"/>
  <!-- Screen glow effect -->
  <rect x="10" y="6" width="12" height="10" rx="1" fill="#22C55E" opacity="0.3"/>
  <!-- X on screen - playing! -->
  <text x="16" y="14" font-family="Arial Black, sans-serif" font-size="8" font-weight="900" fill="#1C1917" text-anchor="middle">▶</text>
  <!-- Control panel -->
  <rect x="10" y="18" width="12" height="4" rx="0.5" fill="#374151"/>
  <!-- Joystick base -->
  <circle cx="13" cy="20" r="1.5" fill="#6B7280"/>
  <rect x="12.5" y="17" width="1" height="3" rx="0.3" fill="#9CA3AF"/>
  <!-- Buttons -->
  <circle cx="17" cy="19.5" r="0.8" fill="#EF4444"/>
  <circle cx="19" cy="20.5" r="0.8" fill="#3B82F6"/>
  <!-- Coin slot -->
  <rect x="13" y="24" width="6" height="2" rx="1" fill="#374151"/>
  <rect x="14" y="24.5" width="4" height="1" rx="0.5" fill="#F97316"/>
</svg>
